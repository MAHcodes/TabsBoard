<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  :root { --accent:#6366f1; --bg:#fff; --surface:#fff; --surface-2:#f0f1f6; --border:#e2e4ec; --text:#1c1e26; --text-muted:#6b7080; }
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .header { padding: 14px 15px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .header img { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; background: var(--surface-2); }
  .header-text { min-width: 0; }
  .header .title { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .header .url { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list { max-height: 260px; overflow-y: auto; padding: 7px; }
  .col-item { display: flex; align-items: center; gap: 9px; padding: 9px 9px; border-radius: 9px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .col-item:hover { background: var(--surface-2); }
  .dot { width: 11px; height: 11px; border-radius: 4px; flex-shrink: 0; }
  .new-row { padding: 9px; border-top: 1px solid var(--border); }
  .new-row input { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 12px; margin-bottom: 7px; }
  .new-row button, .open-dash { width: 100%; padding: 9px; border: none; border-radius: 8px; background: var(--accent); color: white; font-size: 12px; font-weight: 700; cursor: pointer; }
  .open-dash { background: none; color: var(--accent); margin-top: 5px; }
  .done { padding: 20px; text-align: center; font-size: 13px; color: #10b981; font-weight: 700; }
  .empty { padding: 15px; text-align: center; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="header">
    <img id="p-favicon" src="" onerror="this.style.visibility='hidden'">
    <div class="header-text">
      <div class="title" id="p-title">Loading…</div>
      <div class="url" id="p-url"></div>
    </div>
  </div>
  <div class="list" id="p-list"></div>
  <div class="new-row">
    <input type="text" id="p-new-name" placeholder="New collection name">
    <button id="p-new-btn">+ Create &amp; add</button>
    <button class="open-dash" id="p-open-dash">Open full dashboard</button>
  </div>
  <script src="../common/color-utils.js"></script>
  <script src="../common/themes.js"></script>
  <script src="../common/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
