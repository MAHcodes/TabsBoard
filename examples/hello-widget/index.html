<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Counter</title>
<style>
  :root { --tb-bg: #222; --tb-text: #eee; --tb-main: #e2b714; --tb-sub: #888; --tb-border: #444; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--tb-text); font: 14px/1.4 var(--tb-font, system-ui, sans-serif); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; box-sizing: border-box; }
  #count { font-size: 40px; color: var(--tb-main); }
  button { background: transparent; color: var(--tb-text); border: 1px solid var(--tb-border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--tb-main); }
  #bm { color: var(--tb-sub); font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <div id="count">…</div>
  <div><button id="inc">Click me</button> <button id="open">Open a bookmark</button></div>
  <div id="bm"></div>
  <script src="tabsboard-widget-sdk.js"></script>
  <script src="widget.js"></script>
</body>
</html>
